<div class="min-h-screen bg-slate-50 text-slate-900">
  <header class="border-b border-slate-200 bg-white">
    <nav class="mx-auto flex max-w-3xl items-center gap-6 px-6 py-4">
      <span class="text-lg font-semibold tracking-tight text-slate-900">recibo-box</span>
      @for (l of links; track l.path) {
        <a [routerLink]="l.path" class="text-sm font-medium text-slate-600 hover:text-blue-600">
          {{ l.label }}
        </a>
      }
    </nav>
  </header>
  <main class="mx-auto max-w-3xl py-8">
    <router-outlet />
  </main>
</div>
