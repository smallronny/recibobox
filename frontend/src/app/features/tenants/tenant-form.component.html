<div class="mx-auto max-w-xl space-y-6 p-6">
  <header class="space-y-1">
    <h1 class="text-2xl font-semibold text-slate-800">
      {{ editing() ? 'Editar inquilino' : 'Nuevo inquilino' }}
    </h1>
    <p class="text-sm text-slate-500">El teléfono (E.164) se usa para el envío del recibo por WhatsApp.</p>
  </header>

  @if (error()) {
    <p class="rounded-lg border border-red-200 bg-red-50 px-4 py-3 text-sm text-red-700">{{ error() }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="onSubmit()"
        class="space-y-4 rounded-xl border border-slate-200 bg-white p-6 shadow-sm">

    <label class="block text-sm font-medium text-slate-600">
      Nombre / Razón social
      <input formControlName="full_name"
             class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
    </label>

    <div class="grid grid-cols-5 gap-3 text-sm font-medium text-slate-600">
      <label>Documento
        <select formControlName="doc_type"
                class="mt-1 block w-full rounded-lg border border-slate-300 bg-white px-3 py-2 text-slate-800 outline-none focus:border-blue-500">
          @for (t of docTypes; track t) {
            <option [value]="t">{{ t }}</option>
          }
        </select>
      </label>
      <label class="col-span-4">N.º (CI/RIF)
        <input formControlName="doc_number"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
      </label>
    </div>

    <div class="grid grid-cols-2 gap-3 text-sm font-medium text-slate-600">
      <label>Teléfono (E.164)
        <input formControlName="phone" placeholder="+58412000000"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
      </label>
      <label>N.º de local
        <input formControlName="local_number" placeholder="Ej. 4A"
               class="mt-1 block w-full rounded-lg border border-slate-300 px-3 py-2 text-slate-800 outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500" />
      </label>
    </div>

    <label class="flex items-center gap-2 text-sm text-slate-600">
      <input type="checkbox" formControlName="is_active" class="h-4 w-4 rounded border-slate-300 text-blue-600" />
      Inquilino activo
    </label>

    <div class="flex items-center gap-3 pt-2">
      <button type="submit" [disabled]="saving()"
              class="rounded-lg bg-blue-600 px-4 py-2.5 text-sm font-semibold text-white hover:bg-blue-700 disabled:opacity-50">
        {{ saving() ? 'Guardando…' : 'Guardar' }}
      </button>
      <a routerLink="/inquilinos" class="text-sm font-medium text-slate-500 hover:text-slate-700">Cancelar</a>
    </div>
  </form>
</div>
