name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SITE_URL: ${{ vars.SITE_URL }}
      APP_DIR: ${{ vars.SERVER_APP_DIR || '/var/www/html/recibobox' }}
      SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Detectar qué aplicaciones sufrieron cambios
      - name: Check for file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            frontend:
              - 'frontend/**'
            backend:
              - 'backend/**'

      - name: Chequeo de variables y secretos
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          fallas=0

          if [ -z "$SSH_HOST" ]; then
            echo "::error::Configura el secreto SERVER_HOST (IP o dominio del servidor)"; fallas=1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::Configura el secreto SERVER_USER (usuario con permisos)"; fallas=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Configura el secreto SERVER_SSH_KEY (clave privada sin passphrase)"; fallas=1
          fi
          if [ "$fallas" != 0 ]; then exit 1; fi

          # Validaciones de seguridad en variables
          if ! printf '%s' "$APP_DIR" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::SERVER_APP_DIR no debe contener espacios ni caracteres inválidos"; exit 1
          fi
          if ! printf '%s' "$SSH_HOST" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::SERVER_HOST no parece una IP o dominio válido"; exit 1
          fi
          case "$SSH_PORT" in
            ''|*[!0-9]*) echo "::error::SERVER_PORT debe ser un puerto numérico"; exit 1 ;;
          esac

          echo "KEY=$RUNNER_TEMP/recibobox-deploy.key" >> "$GITHUB_ENV"
          echo "SSH_BASE=ssh -i $RUNNER_TEMP/recibobox-deploy.key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Instalar clave SSH y probar conexión
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"

          if ! ssh-keygen -y -P "" -f "$KEY" > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY no es una clave privada válida o tiene passphrase."
            exit 1
          fi

          ${SSH_BASE} "$SSH_USER@$SSH_HOST" '
            echo "SSH ok: $(hostname)"
            command -v rsync > /dev/null 2>&1 || echo "::warning::rsync no está instalado en el servidor"
            command -v pm2   > /dev/null 2>&1 || echo "::warning::pm2 no está instalado en el servidor"
          '

      # 2. Configurar Node.js y caché de npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------------
      # PASOS DE COMPILACIÓN (BUILD)
      # -----------------------------------------------------------------

      - name: Instalar dependencias globales del repositorio
        run: npm ci

      - name: Build frontend Website
        if: steps.changes.outputs.frontend == 'true'
        working-directory: ./frontend
        run: |
          npm ci
          CI=true npm run build

      - name: Build backend
        if: steps.changes.outputs.backend == 'true'
        working-directory: ./backend
        run: |
          npm ci
          npm run build

      # -----------------------------------------------------------------
      # PREPARACIÓN DE CARPETAS EN EL SERVIDOR Y RSYNC
      # -----------------------------------------------------------------

      - name: Crear estructura de directorios en el servidor
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          ${SSH_BASE} "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR/frontend/browser' '$APP_DIR/backend/dist'"

      - name: Sincronizar Frontend (si cambió)
        if: steps.changes.outputs.frontend == 'true'
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avz --delete -e "$SSH_BASE" \
            ./frontend/dist/recibo-box/browser/ \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/frontend/browser/"

      - name: Sincronizar Backend (si cambió)
        if: steps.changes.outputs.backend == 'true'
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avz --delete -e "$SSH_BASE" \
            ./backend/dist/ \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/backend/dist/"
          rsync -avz -e "$SSH_BASE" \
            ./backend/package.json \
            ./backend/package-lock.json \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/backend/"

      # -----------------------------------------------------------------
      # INSTALACIÓN Y REINICIO DE SERVICIOS EN EL SERVIDOR
      # -----------------------------------------------------------------

      - name: Restart Services with PM2
        if: steps.changes.outputs.backend == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # Cargar NVM y Node.js en la sesión SSH no interactiva
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            # 1. Si hubo cambios en el backend, instalar dependencias de producción
            cd ${{ env.APP_DIR }}/backend
            npm install --omit=dev

            # 2. Ir a la raíz del servidor donde se encuentra ecosystem.config.js
            cd ${{ env.APP_DIR }}

            # 3. Recargar/Reiniciar el backend en PM2 con variables actualizadas
            pm2 restart ecosystem.config.js --update-env || pm2 reload ecosystem.config.js --update-env
            pm2 save