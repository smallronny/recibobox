name: Continuous Integration & Deployment (CI/CD)

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SITE_URL: ${{ vars.SITE_URL }}
      APP_DIR: ${{ vars.SERVER_APP_DIR || '/var/www/html/yobusco' }}
      SSH_PORT: ${{ secrets.SERVER_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 1. Detectar qué aplicaciones sufrieron cambios
      - name: Check for file changes
        id: changes
        uses: dorny/paths-filter@v3
        with:
          filters: |
            angular:
              - 'angular/**'
            api:
              - 'nest/**'
            workspace:
              - 'yobusco-angular-backoffice/**'

      - name: Chequeo de variables y secretos
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          fallas=0

          if [ -z "$SSH_HOST" ]; then
            echo "::error::Configura el secreto SERVER_HOST (IP o dominio del servidor)"; fallas=1
          fi
          if [ -z "$SSH_USER" ]; then
            echo "::error::Configura el secreto SERVER_USER (usuario con permisos)"; fallas=1
          fi
          if [ -z "$SSH_PRIVATE_KEY" ]; then
            echo "::error::Configura el secreto SERVER_SSH_KEY (clave privada sin passphrase)"; fallas=1
          fi
          if [ "$fallas" != 0 ]; then exit 1; fi

          # Validaciones de seguridad en variables
          if ! printf '%s' "$APP_DIR" | grep -qE '^[A-Za-z0-9._/-]+$'; then
            echo "::error::SERVER_APP_DIR no debe contener espacios ni caracteres inválidos"; exit 1
          fi
          if ! printf '%s' "$SSH_HOST" | grep -qE '^[A-Za-z0-9._-]+$'; then
            echo "::error::SERVER_HOST no parece una IP o dominio válido"; exit 1
          fi
          case "$SSH_PORT" in
            ''|*[!0-9]*) echo "::error::SERVER_PORT debe ser un puerto numérico"; exit 1 ;;
          esac

          echo "KEY=$RUNNER_TEMP/yobusco-deploy.key" >> "$GITHUB_ENV"
          echo "SSH_BASE=ssh -i $RUNNER_TEMP/yobusco-deploy.key -p $SSH_PORT -o StrictHostKeyChecking=accept-new -o BatchMode=yes" >> "$GITHUB_ENV"

      - name: Instalar clave SSH y probar conexión
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
          SSH_PRIVATE_KEY: ${{ secrets.SERVER_SSH_KEY }}
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          install -m 600 /dev/null "$KEY"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$KEY"

          if ! ssh-keygen -y -P "" -f "$KEY" > /dev/null 2>&1; then
            echo "::error::SERVER_SSH_KEY no es una clave privada válida o tiene passphrase."
            exit 1
          fi

          ${SSH_BASE} "$SSH_USER@$SSH_HOST" '
            echo "SSH ok: $(hostname)"
            command -v rsync > /dev/null 2>&1 || echo "::warning::rsync no está instalado en el servidor"
            command -v pm2   > /dev/null 2>&1 || echo "::warning::pm2 no está instalado en el servidor"
          '

      # 2. Configurar Node.js y caché de npm
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      # -----------------------------------------------------------------
      # PASOS DE COMPILACIÓN (BUILD)
      # -----------------------------------------------------------------

      - name: Instalar dependencias globales del monorepo
        run: npm ci

      - name: Build Angular Website
        if: steps.changes.outputs.angular == 'true'
        working-directory: ./angular
        run: |
          npm ci
          npm run build:staging

      - name: Build NestJS API
        if: steps.changes.outputs.api == 'true'
        working-directory: ./nest
        run: |
          npm ci
          npm run build

      - name: Build Angular Dashboard
        if: steps.changes.outputs.workspace == 'true'
        working-directory: ./yobusco-angular-backoffice
        run: |
          npm ci
          npx ng build --configuration production --base-href /dash/

      # -----------------------------------------------------------------
      # PREPARACIÓN DE CARPETAS EN EL SERVIDOR Y RSYNC
      # -----------------------------------------------------------------

      - name: Crear estructura de directorios en el servidor
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          ${SSH_BASE} "$SSH_USER@$SSH_HOST" "mkdir -p '$APP_DIR/website' '$APP_DIR/backend' '$APP_DIR/dash'"

      - name: Sincronizar Website Angular (si cambió)
        if: steps.changes.outputs.angular == 'true'
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avz --delete -e "$SSH_BASE" \
            ./angular/dist/ \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/website/"

      - name: Sincronizar API NestJS (si cambió)
        if: steps.changes.outputs.api == 'true'
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avz --delete --no-perms --exclude 'node_modules' -e "$SSH_BASE" \
            ./nest/dist/ \
            ./nest/package.json \
            ./nest/package-lock.json \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/backend/"

      - name: Sincronizar Dashboard (si cambió)
        if: steps.changes.outputs.workspace == 'true'
        env:
          SSH_HOST: ${{ secrets.SERVER_HOST }}
          SSH_USER: ${{ secrets.SERVER_USER }}
        run: |
          rsync -avz --delete -e "$SSH_BASE" \
            ./yobusco-angular-backoffice/dist/johana-angular/browser/ \
            "${SSH_USER}@${SSH_HOST}:${APP_DIR}/dash/"

      # -----------------------------------------------------------------
      # INSTALACIÓN Y REINICIO DE SERVICIOS EN EL SERVIDOR
      # -----------------------------------------------------------------

      - name: Restart Services with PM2
        if: steps.changes.outputs.api == 'true' || steps.changes.outputs.angular == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            set -e

            # Cargar NVM y Node.js en la sesión SSH no interactiva
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            # 1. Si hubo cambios en la API NestJS, instalar dependencias de producción
            if [ "${{ steps.changes.outputs.api }}" = "true" ]; then
              cd /var/www/html/yobusco/backend
              npm install --omit=dev
            fi

            # 2. Ir a la raíz del servidor donde se encuentra ecosystem.config.js
            cd /var/www/html/yobusco

            # 3. Recargar/Reiniciar los procesos de PM2
            pm2 reload ecosystem.config.js || pm2 restart ecosystem.config.js
            pm2 save