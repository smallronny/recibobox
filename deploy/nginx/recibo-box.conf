#
# Config de nginx para recibo-box: Angular estático en la RAÍZ del dominio
# y la API (pm2, APP_PORT) proxyeada bajo /api.
#
# Instalación — desde tu máquina, con el deploy configurado:
#
#   scp deploy/nginx/recibo-box.conf SSH_USER@SERVIDOR:/tmp/recibo-box.conf
#
# En el servidor (como root):
#
#   cp deploy/nginx/recibo-box.conf /etc/nginx/sites-available/recibo-box.conf
#   # 1) reemplaza tudominio.com por tu dominio
#   # 2) ajusta /opt/recibo-box si usaste otro SERVER_APP_DIR, y 3000 si tu
#   #    backend/.env define otro APP_PORT
#   ln -sfn /etc/nginx/sites-available/recibo-box.conf /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#
# HTTPS (una vez que el DNS apunte al servidor):
#   sudo apt install -y certbot python3-certbot-nginx
#   sudo certbot --nginx -d tudominio.com
#   # certbot agrega el bloque :443 y puede activar la redirección HTTP→HTTPS
#   # automáticamente; si no, descomenta el return 301 del bloque :80.

server {
    listen 80;
    server_name tudominio.com www.tudominio.com;

    # Descomenta cuando exista el certificado TLS (o deja que certbot lo haga):
    # return 301 https://$host$request_uri;

    root /opt/recibo-box/web;
    index index.html;

    # Tolerancia para respuestas/PDFs más grandes
    client_max_body_size 25m;
    proxy_read_timeout 120s;

    gzip on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_vary on;

    # API → pm2 (127.0.0.1:APP_PORT; default 3000). ^~ evita que el regex de
    # assets capture rutas /api/*.pdf
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA Angular: archivos estáticos + fallback de rutas a index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Assets con hash de Angular: cachear 7 días
    location ~* \.(?:css|js|mjs|png|jpg|jpeg|gif|webp|svg|ico|woff2?|ttf)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
    }

    access_log /var/log/nginx/recibo-box.access.log;
    error_log  /var/log/nginx/recibo-box.error.log;
}
